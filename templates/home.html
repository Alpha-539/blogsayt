{% extends 'base.html' %}

{% block content %}
    {%  for post in object_list %}
        <div class="post-entry">
            <h3><a href="{% url 'post_detail' post.slug %}">{{post.title}}</a></h3>
            <p>{{post.body | truncatewords:20}}</p>
        </div>
    {% endfor %}
    <h3><a href="{% url 'post_create' %}">Post yaratish</a></h3>
{% endblock content %}
